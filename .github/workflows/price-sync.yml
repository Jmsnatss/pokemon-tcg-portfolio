name: Price Sync

on:
  schedule:
    # Run daily at 02:00 UTC (10:00 PHT)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force refresh all prices (ignores staleness check)'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync-prices:
    name: Sync Market Prices
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Run price sync
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
          PRICECHARTING_API_KEY: ${{ secrets.PRICECHARTING_API_KEY }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
        run: |
          # Script will be implemented in Milestone 5
          echo "Price sync script not yet implemented — placeholder"
          echo "FORCE_REFRESH=$FORCE_REFRESH"

