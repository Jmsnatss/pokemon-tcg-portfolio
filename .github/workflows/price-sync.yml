name: Price Sync

on:
  schedule:
    # Run daily at 02:00 UTC (10:00 PHT)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-prices:
    name: Sync Market Prices
    runs-on: ubuntu-latest

    steps:
      - name: Trigger price sync on the deployed app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL and CRON_SECRET repository secrets"
            exit 1
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 120 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/sync-prices")
          cat response.json
          echo
          [ "$code" = "200" ]
